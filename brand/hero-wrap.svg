<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="720" height="480" rx="10" fill="#0d1117"/>
  <g stroke="#161b22" stroke-width="1">
    <path d="M40 0V480M140 0V480M240 0V480M340 0V480M440 0V480M540 0V480M640 0V480"/>
    <path d="M0 40H720M0 140H720M0 240H720M0 340H720M0 440H720"/>
  </g>
  <line x1="360" y1="36" x2="360" y2="446" stroke="#fb923c" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 4"/>

  <!-- terminal -->
  <rect x="279" y="38" width="162" height="60" rx="7" fill="none" stroke="#2dd4bf" stroke-opacity="0.3" stroke-width="1" filter="url(#glow)"/>
  <rect x="281" y="40" width="158" height="56" rx="6" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M281 46a6 6 0 0 1 6-6h146a6 6 0 0 1 6 6v11H281z" fill="#21262d"/>
  <circle cx="292" cy="51" r="2.5" fill="#ff5f56"/><circle cx="301" cy="51" r="2.5" fill="#ffbd2e"/><circle cx="310" cy="51" r="2.5" fill="#27c93f"/>
  <text x="295" y="82" font-size="14" font-weight="bold" fill="#2dd4bf">mov up prod<tspan fill="#38bdf8">_</tspan></text>
  <line x1="360" y1="96" x2="360" y2="110" stroke="url(#beam)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- L1  mov, the wrapper -->
  <polygon points="360,110 510,185 360,260 210,185" fill="#2dd4bf" fill-opacity="0.10" stroke="#2dd4bf" stroke-width="6" stroke-linejoin="round" filter="url(#glow)"/>
  <line x1="514" y1="185" x2="536" y2="185" stroke="#2dd4bf" stroke-opacity="0.45"/>
  <text x="542" y="182" font-size="13" font-weight="bold" fill="#2dd4bf" letter-spacing="1.5">mov</text>
  <text x="542" y="197" font-size="10" fill="#8b949e">one CLI</text>

  <!-- L2  azure cli -->
  <polygon points="360,202 482,263 360,324 238,263" fill="#818cf8" fill-opacity="0.08" stroke="#818cf8" stroke-width="6" stroke-linejoin="round"/>
  <line x1="486" y1="263" x2="508" y2="263" stroke="#818cf8" stroke-opacity="0.45"/>
  <text x="514" y="260" font-size="13" font-weight="bold" fill="#818cf8" letter-spacing="1.5">az</text>
  <text x="514" y="275" font-size="10" fill="#8b949e">ARM · what-if · audit</text>

  <!-- L3  git / gh -->
  <polygon points="360,285 456,333 360,381 264,333" fill="#38bdf8" fill-opacity="0.07" stroke="#38bdf8" stroke-width="6" stroke-linejoin="round"/>
  <line x1="460" y1="333" x2="482" y2="333" stroke="#38bdf8" stroke-opacity="0.45"/>
  <text x="488" y="330" font-size="13" font-weight="bold" fill="#38bdf8" letter-spacing="1.5">gh · git</text>
  <text x="488" y="345" font-size="10" fill="#8b949e">releases · repo clone</text>

  <!-- L4  the host -->
  <polygon points="360,359 432,395 360,431 288,395" fill="#67e8f9" fill-opacity="0.07" stroke="#67e8f9" stroke-width="6" stroke-linejoin="round"/>
  <line x1="436" y1="395" x2="458" y2="395" stroke="#67e8f9" stroke-opacity="0.45"/>
  <text x="464" y="392" font-size="13" font-weight="bold" fill="#67e8f9" letter-spacing="1.5">host</text>
  <text x="464" y="407" font-size="10" fill="#8b949e">ssh · run-command</text>

  <!-- annotation: everything below mov is shelled out, and recorded -->
  <g stroke="#fb923c" stroke-opacity="0.55" stroke-width="1" fill="none">
    <path d="M186 202h-16v229h16"/>
    <line x1="170" y1="316" x2="158" y2="316"/>
  </g>
  <text x="150" y="312" font-size="11" font-weight="bold" fill="#fb923c" fill-opacity="0.85" text-anchor="end">shelled out</text>
  <text x="150" y="327" font-size="10" fill="#8b949e" text-anchor="end">every command recorded</text>

  <text x="360" y="459" font-size="10.5" fill="#6e7681" text-anchor="middle" letter-spacing="0.5">one profile · one command · nothing hidden underneath</text>
</svg>
