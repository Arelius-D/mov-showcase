<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>mov — a CLI harness for Azure</title>
    <meta
      name="description"
      content="An interactive map of a profile-driven Azure CLI: a JSON file on your machine, a repository on GitHub, and infrastructure in Azure — and every arc between them."
    />
    <link rel="stylesheet" href="src/styles.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Ctext y='19' font-size='19'%3E%E2%97%88%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div class="page">
      <header class="masthead">
        <div>
          <h1 class="masthead__title">mov</h1>
          <p class="masthead__kicker">a CLI harness for Azure</p>
          <p class="masthead__lede">
            An environment is one JSON file. mov reads it, builds it in Azure,
            and deletes it again. Three places, and everything that passes
            between them.
          </p>
        </div>
        <div class="controls">
          <div class="zoom" role="group" aria-label="Map zoom">
            <button class="zoom__step" type="button" id="zoom-out" aria-label="Zoom out">
              &minus;
            </button>
            <button class="zoom__level" type="button" id="zoom-reset" aria-live="polite">
              100%
            </button>
            <button class="zoom__step" type="button" id="zoom-in" aria-label="Zoom in">
              +
            </button>
          </div>
          <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch theme">
            <svg class="theme-toggle__glyph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false">
              <circle class="theme-toggle__disc" cx="12" cy="12" r="5" />
              <g class="theme-toggle__rays">
                <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
              </g>
              <path class="theme-toggle__crescent" d="M12 3a6 6 0 009 9 9 9 0 11-9-9Z" />
            </svg>
          </button>
        </div>
      </header>

      <div class="finder">
        <input
          class="finder__input"
          id="search"
          type="search"
          placeholder="Filter the map"
          aria-label="Filter the map"
          autocomplete="off"
        />
        <span class="finder__count" id="search-count" aria-live="polite"></span>
      </div>

      <main class="workbench">
        <!-- The map is one focus scope: the SVG sits behind the zones and is
             purely presentational, so it is hidden from assistive tech. Every
             relationship it draws is also listed in the panel as text. -->
        <!-- The stage is the thing that scales. Zones and arcs are inside it
             together, so zooming is one transform on one element and the arcs
             never have to be redrawn to match. -->
        <div class="map" id="map">
          <div class="stage" id="stage">
            <svg
              class="map__arcs"
              id="arcs"
              aria-hidden="true"
              focusable="false"
            ></svg>
            <div class="map__zones" id="zones"></div>
          </div>
        </div>

        <aside
          class="panel"
          id="panel"
          aria-live="polite"
          aria-label="Details of the selected object"
        ></aside>
      </main>

      <footer class="legend" id="legend"></footer>
    </div>

    <!-- Classic scripts, in dependency order. No modules: ES module imports are
         blocked over file://, and this page has to open by double-clicking it. -->
    <script src="src/map.js"></script>
    <script src="src/render.js"></script>
    <script src="src/arcs.js"></script>
    <script src="src/interact.js"></script>
  </body>
</html>
